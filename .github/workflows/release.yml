name: Release (direct APK link)

# Builds the release APK on every push to main and publishes it as the
# GitHub release v<pubspec version>, marked "latest", so this link always
# serves the newest APK:
# https://github.com/maheshraikg/po-calculator/releases/latest/download/po_calculator.apk
# and a smaller 64-bit-only APK at .../latest/download/po_calculator_small.apk
# The same version is re-uploaded in place; bump `version:` in pubspec.yaml
# for a new release.
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', 'store/**', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time: overlapping runs would both edit the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk po_calculator.apk

      # Smaller APK with only the 64-bit ARM code that nearly every phone
      # since ~2019 runs. Not --split-per-abi: that raises the version code
      # per ABI, so phones could not move between this and the full APK.
      # Same version code and key, so either file updates the other.
      - name: Build small APK (64-bit phones)
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols-arm64
          cp build/app/outputs/flutter-apk/app-release.apk po_calculator_small.apk
          ls -l po_calculator.apk po_calculator_small.apk

      # Play Store bundle, signed with your private upload key. Runs only
      # when the four PO_UPLOAD_* repository secrets exist (see README.md).
      # The bundle is a private workflow artifact, never a public release;
      # the direct APK keeps the test key so installed copies can update.
      - name: Build Play Store bundle (upload key)
        env:
          KEYSTORE_B64: ${{ secrets.PO_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PO_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PO_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PO_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No upload key secrets: skipping the Play Store bundle."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols-aab
          rm android/key.properties "$RUNNER_TEMP/upload.jks"
          mkdir -p play && cp build/app/outputs/bundle/release/app-release.aab play/po_calculator.aab
          cp -r build/symbols-aab play/symbols

      - name: Keep the Play Store bundle (private)
        if: hashFiles('play/po_calculator.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: po-calculator-play-bundle
          path: play/
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v$VERSION"
          NOTES="PO Calculator v$VERSION: offline Post Office savings calculator in 11 Indian languages. Install: download po_calculator_small.apk (smaller, for most phones made since 2019) or po_calculator.apk (works on every phone) on your phone, open it, and allow installing from this source. Estimate only, confirm at your post office. Not affiliated with India Post."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" po_calculator.apk po_calculator_small.apk --clobber
          else
            gh release create "$TAG" po_calculator.apk po_calculator_small.apk --title "PO Calculator v$VERSION" \
              --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
